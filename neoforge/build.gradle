plugins {
    id 'multiloader-loader'
    id 'net.neoforged.moddev'
    id 'me.modmuss50.mod-publish-plugin'
}

def commonResourcesDir = project(':common').file('src/main/resources/')

sourceSets {
    gametest {
        compileClasspath += sourceSets.main.output
        runtimeClasspath += sourceSets.main.output
    }
}

neoForge {
    enable {
        version = neoforge_version
        enabledSourceSets = [sourceSets.main, sourceSets.gametest]
    }
    def at = project(':common').file('src/main/resources/META-INF/accesstransformer.cfg')
    if (at.exists()) {
        accessTransformers.from(at.absolutePath)
    }
    runs {
        configureEach {
            systemProperty('neoforge.enabledGameTestNamespaces', mod_id)
            ideName = "NeoForge ${it.name.capitalize()} (${project.path})"
        }
        client {
            client()
            gameDirectory = this.mkdir(this.file('runs/client'))
        }
        server {
            server()
            programArgument '--nogui'
            gameDirectory = this.mkdir(this.file('runs/server'))
        }
        gameTestServer {
            type = 'gameTestServer'
            sourceSet = sourceSets.gametest
            gameDirectory = this.mkdir(this.file('runs/gametest'))
        }
        data {
            clientData()
            gameDirectory = this.mkdir(this.file('runs/data'))
            programArguments.addAll '--mod', project.mod_id, '--all', '--output', file('src/generated/resources/').getAbsolutePath(), '--existing', commonResourcesDir.getAbsolutePath()
        }
    }
    mods {
        "${mod_id}" {
            sourceSet sourceSets.main
            sourceSet sourceSets.gametest
        }
    }
}

sourceSets.main.resources { srcDir 'src/generated/resources' }

dependencies {
    compileOnly "top.theillusivec4.curios:curios-neoforge:${curios_version}"
    runtimeOnly "top.theillusivec4.curios:curios-neoforge:${curios_version}"
}

publishMods {
    file = tasks.named('jar', Jar).flatMap { it.archiveFile }
    version = "${project.version}+neoforge"
    displayName = "${mod_name} ${mod_version} for NeoForge ${minecraft_version}"
    def changelogFile = rootProject.file('CHANGELOG.md')
    changelog = changelogFile.exists() ? changelogFile.text : "Release ${mod_version}"
    modLoaders.add('neoforge')

    def channel = mod_version.toLowerCase()
    if (channel.contains('alpha')) {
        type = ALPHA
    } else if (channel.contains('beta') || channel.contains('snapshot') || channel.contains('rc')) {
        type = BETA
    } else {
        type = STABLE
    }

    if (curseforge_project_id) {
        curseforge {
            projectId = curseforge_project_id
            accessToken = providers.environmentVariable('CURSEFORGE_TOKEN')
            minecraftVersions.add(minecraft_version)
            javaVersions.add(JavaVersion.toVersion(java_version))
            clientRequired = true
            serverRequired = true
            optional { slug = 'curios' }
        }
    }

    if (modrinth_project_id) {
        modrinth {
            projectId = modrinth_project_id
            accessToken = providers.environmentVariable('MODRINTH_TOKEN')
            minecraftVersions.add(minecraft_version)
            optional('curios')
        }
    }
}

def loaderAttribute = Attribute.of('io.github.mcgradleconventions.loader', String)
['apiElements', 'runtimeElements', 'sourcesElements', 'javadocElements'].each { variant ->
    configurations.named("$variant") {
        attributes {
            attribute(loaderAttribute, 'neoforge')
        }
    }
}
sourceSets.configureEach { sourceSet ->
    [sourceSet.compileClasspathConfigurationName,
     sourceSet.runtimeClasspathConfigurationName,
     sourceSet.getTaskName(null, 'jarJar')].each { variant ->
        configurations.matching { it.name == variant }.configureEach {
            attributes {
                attribute(loaderAttribute, 'neoforge')
            }
        }
    }
}
