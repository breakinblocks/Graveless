plugins {
    id 'multiloader-loader'
    id 'net.fabricmc.fabric-loom'
    id 'me.modmuss50.mod-publish-plugin'
}

dependencies {
    minecraft "com.mojang:minecraft:${minecraft_version}"
    implementation "net.fabricmc:fabric-loader:${fabric_loader_version}"
    implementation "net.fabricmc.fabric-api:fabric-api:${fabric_version}"
    implementation "fuzs.forgeconfigapiport:forgeconfigapiport-fabric:${fcap_version}"
}

loom {
    def aw = project(':common').file("src/main/resources/${mod_id}.accesswidener")
    if (aw.exists()) {
        accessWidenerPath.set(aw)
    }
    runs {
        client {
            client()
            setConfigName('Fabric Client')
            ideConfigGenerated(true)
            runDir('runs/client')
        }
        server {
            server()
            setConfigName('Fabric Server')
            ideConfigGenerated(true)
            runDir('runs/server')
        }
    }
}

def fabricOutputJar = tasks.names.contains('remapJar') ? tasks.named('remapJar', Jar) : tasks.named('jar', Jar)

publishMods {
    file = fabricOutputJar.flatMap { it.archiveFile }
    version = "${project.version}+fabric"
    displayName = "${mod_name} ${mod_version} for Fabric ${minecraft_version}"
    def changelogFile = rootProject.file('CHANGELOG.md')
    changelog = changelogFile.exists() ? changelogFile.text : "Release ${mod_version}"
    modLoaders.add('fabric')

    def channel = mod_version.toLowerCase()
    if (channel.contains('alpha')) {
        type = ALPHA
    } else if (channel.contains('beta') || channel.contains('snapshot') || channel.contains('rc')) {
        type = BETA
    } else {
        type = STABLE
    }

    if (curseforge_project_id) {
        curseforge {
            projectId = curseforge_project_id
            accessToken = providers.environmentVariable('CURSEFORGE_TOKEN')
            minecraftVersions.add(minecraft_version)
            javaVersions.add(JavaVersion.toVersion(java_version))
            clientRequired = true
            serverRequired = true
            requires('fabric-api', 'forge-config-api-port')
        }
    }

    if (modrinth_project_id) {
        modrinth {
            projectId = modrinth_project_id
            accessToken = providers.environmentVariable('MODRINTH_TOKEN')
            minecraftVersions.add(minecraft_version)
            requires('fabric-api', 'forge-config-api-port')
        }
    }
}

def loaderAttribute = Attribute.of('io.github.mcgradleconventions.loader', String)
['apiElements', 'runtimeElements', 'sourcesElements', 'javadocElements', 'includeInternal', 'modCompileClasspath'].each { variant ->
    configurations.named("$variant") {
        attributes {
            attribute(loaderAttribute, 'fabric')
        }
    }
}
sourceSets.configureEach {
    [it.compileClasspathConfigurationName, it.runtimeClasspathConfigurationName].each { variant ->
        configurations.named("$variant") {
            attributes {
                attribute(loaderAttribute, 'fabric')
            }
        }
    }
}
