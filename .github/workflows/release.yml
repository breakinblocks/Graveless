name: Release

on:
  workflow_dispatch:
    inputs:
      maven_only:
        description: Publish to the BreakInBlocks Maven only, skipping CurseForge and Modrinth
        type: boolean
        default: false

permissions:
  contents: read

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Java 25
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 25

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Build
        run: chmod +x gradlew && ./gradlew build

      - name: Upload jars as workflow artifacts
        uses: actions/upload-artifact@v4
        with:
          name: jars
          path: |
            neoforge/build/libs/graveless-neoforge-*.jar
            fabric/build/libs/graveless-fabric-*.jar
          if-no-files-found: error

      - name: Publish
        run: ./gradlew ${{ inputs.maven_only && 'publishMaven' || 'publishMod' }}
        env:
          CURSEFORGE_TOKEN: ${{ secrets.CURSEFORGE_TOKEN }}
          MODRINTH_TOKEN: ${{ secrets.MODRINTH_TOKEN }}
          MAVEN_USER: ${{ secrets.MAVEN_USER }}
          MAVEN_TOKEN: ${{ secrets.MAVEN_TOKEN }}
